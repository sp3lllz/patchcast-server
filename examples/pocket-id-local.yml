# A throw-away Pocket ID for testing sign-in on one machine (real use: your own instance behind TLS).
# The issuer must be one URL that the host browser, the Android emulator and the server container can all reach, and
# Pocket ID refuses IP addresses (WebAuthn needs a host name). http://auth.localhost:1411 works everywhere:
#   browsers (host and emulator) resolve *.localhost to loopback; the emulator's loopback is forwarded with
#     adb reverse tcp:1411 tcp:1411 && adb reverse tcp:8090 tcp:8090
#   containers reach it through the network alias below (start the server with examples/oidc-local.yml).
#   export POCKET_ENCRYPTION_KEY=$(openssl rand -base64 32) POCKET_API_KEY=$(openssl rand -hex 24)
#   docker compose -f examples/pocket-id-local.yml up -d
name: patchcast-pocketid
services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2
    ports: ["1411:1411"]
    environment:
      APP_URL: ${APP_URL:-http://auth.localhost:1411}
      ENCRYPTION_KEY: ${POCKET_ENCRYPTION_KEY:?}
      STATIC_API_KEY: ${POCKET_API_KEY:?}
      TRUST_PROXY: ${POCKET_TRUST_PROXY:-false}
      ANALYTICS_DISABLED: "true"
    volumes: ["pocket:/app/data"]
    networks: { patchcast-oidc: { aliases: [auth.localhost] } }
volumes:
  pocket:
networks:
  patchcast-oidc: { name: patchcast-oidc }
