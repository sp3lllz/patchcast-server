# Patchcast Sync, simple setup: http://<this machine>:8080
# Needs an OIDC provider (Pocket ID): set PUBLIC_URL, OIDC_ISSUER, OIDC_CLIENT_ID and OIDC_CLIENT_SECRET in .env (see .env.example).
# The first sign-in on an empty server becomes the administrator (README → "First administrator").
# Plain http is fine on your own LAN; anything reachable from the internet belongs behind TLS (docker-compose.traefik.yml).
name: patchcast
services:
  patchcast:
    image: ${PATCHCAST_IMAGE:-ghcr.io/sp3lllz/patchcast-server:latest}
    build: .
    restart: unless-stopped
    ports:
      - "${BIND:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    environment:
      # Required: sign-in is only through the OIDC provider (see README "Pocket ID setup").
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      BASE_PATH: ${BASE_PATH:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      SESSION_SECRET: ${SESSION_SECRET:-}
      FEED_REFRESH_MINUTES: ${FEED_REFRESH_MINUTES:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-Europe/London}
      SSRF_ALLOW_HOSTS: ${SSRF_ALLOW_HOSTS:-}
      OIDC_ISSUER: ${OIDC_ISSUER:?set OIDC_ISSUER in .env}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID in .env}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_CLIENT_SECRET_FILE: ${OIDC_CLIENT_SECRET_FILE:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-}
      OIDC_AUTO_CREATE: ${OIDC_AUTO_CREATE:-true}
      OIDC_ALLOWED_GROUPS: ${OIDC_ALLOWED_GROUPS:-}
      OIDC_ADMIN_GROUPS: ${OIDC_ADMIN_GROUPS:-}
    volumes:
      - data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 15s
volumes:
  data:
